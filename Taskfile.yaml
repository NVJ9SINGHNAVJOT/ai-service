version: "3"

# ---------------------------------------------------------------------------
# Variables — override at call site: task model:download MODEL=org/repo
# ---------------------------------------------------------------------------
vars:
  PYTHON: python3
  APP_MODULE: app.main:app
  HOST: '{{.API_HOST | default "0.0.0.0"}}'
  PORT: '{{.API_PORT | default "8000"}}'
  MODEL: '{{.MODEL | default ""}}'
  FORCE: '{{.FORCE | default "false"}}'

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  # ── Setup ────────────────────────────────────────────────────────────────

  venv:
    desc: "Create a local Python virtual environment in .venv using the configured Python binary"
    cmds:
      - "{{.PYTHON}} -m venv .venv"
      - 'echo "Virtual environment created at .venv"'
      - 'echo "Activate it with: source .venv/bin/activate"'

  setup:
    desc: "Clean the project, create a local virtualenv, and install dependencies"
    cmds:
      - task clean
      - task venv
      - .venv/bin/python -m pip install --upgrade pip
      - .venv/bin/python -m pip install -r requirements.txt
      - 'echo "Setup complete. Activate the virtual environment with: source .venv/bin/activate"'

  install:
    desc: "Install all Python dependencies into the active virtualenv"
    cmds:
      - "{{.PYTHON}} -m pip install --upgrade pip"
      - "{{.PYTHON}} -m pip install -r requirements.txt"

  install:dev:
    desc: "Install dependencies including dev/test extras"
    cmds:
      - "{{.PYTHON}} -m pip install --upgrade pip"
      - "{{.PYTHON}} -m pip install -r requirements.txt"
      - "{{.PYTHON}} -m pip install pytest httpx"

  # ── Server ───────────────────────────────────────────────────────────────

  run:api:
    desc: "Start the FastAPI inference server"
    cmds:
      - "{{.PYTHON}} -m app.cli.main serve --host {{.HOST}} --port {{.PORT}}"

  run:cli:
    desc: "Show CLI help"
    cmds:
      - "{{.PYTHON}} -m app.cli.main --help"

  # ── Model management ─────────────────────────────────────────────────────

  model:list:
    desc: "List all available local models (downloaded + custom)"
    cmds:
      - "{{.PYTHON}} -m app.cli.main models list"

  model:doctor:
    desc: "Diagnose one model or all local models. Usage: task model:doctor [MODEL=<local-name>]"
    cmds:
      - |
        if [ -n "{{.MODEL}}" ]; then
          {{.PYTHON}} -m app.cli.main models doctor --name {{.MODEL}}
        else
          {{.PYTHON}} -m app.cli.main models doctor
        fi

  model:download:
    desc: "Download an MLX-compatible HuggingFace model. Usage: task model:download MODEL=mlx-community/Llama-3.2-3B-Instruct-4bit"
    cmds:
      - |
        if [ -z "{{.MODEL}}" ]; then
          echo "ERROR: MODEL variable is required."
          echo "Usage: task model:download MODEL=mlx-community/Llama-3.2-3B-Instruct-4bit"
          exit 1
        fi
      - "{{.PYTHON}} -m app.cli.main models download --repo {{.MODEL}}"

  model:update:
    desc: "Re-download (update) an existing model. Usage: task model:update MODEL=<local-name>"
    cmds:
      - |
        if [ -z "{{.MODEL}}" ]; then
          echo "ERROR: MODEL variable is required."
          echo "Usage: task model:update MODEL=mlx-community__Llama-3.2-3B-Instruct-4bit"
          exit 1
        fi
      - "{{.PYTHON}} -m app.cli.main models update --name {{.MODEL}}"

  model:delete:
    desc: "Delete a downloaded model. Usage: task model:delete MODEL=<local-name> [FORCE=true]"
    cmds:
      - |
        if [ -z "{{.MODEL}}" ]; then
          echo "ERROR: MODEL variable is required."
          echo "Usage: task model:delete MODEL=mlx-community__Llama-3.2-3B-Instruct-4bit"
          exit 1
        fi
      - |
        if [ "{{.FORCE}}" = "true" ]; then
          {{.PYTHON}} -m app.cli.main models delete --name {{.MODEL}} --force
        else
          {{.PYTHON}} -m app.cli.main models delete --name {{.MODEL}}
        fi

  model:chat:
    desc: "Start an interactive CLI chat session with a model. Usage: task model:chat MODEL=<local-name>"
    cmds:
      - |
        if [ -z "{{.MODEL}}" ]; then
          echo "ERROR: MODEL variable is required."
          echo "Usage: task model:chat MODEL=mlx-community__Llama-3.2-3B-Instruct-4bit"
          exit 1
        fi
      - "{{.PYTHON}} -m app.cli.main chat --model {{.MODEL}} {{.CLI_ARGS}}"

  model:chat-media:
    desc: "Start an interactive media chat session via mlx-vlm. Usage: task model:chat-media MODEL=<local-name> [IMAGE=/path/to/image] [AUDIO=/path/to/audio]"
    vars:
      IMAGE: '{{.IMAGE | default ""}}'
      AUDIO: '{{.AUDIO | default ""}}'
      SYSTEM: '{{.SYSTEM | default ""}}'
    cmds:
      - |
        if [ -z "{{.MODEL}}" ]; then
          echo "ERROR: MODEL variable is required."
          echo "Usage: task model:chat-media MODEL=mlx-community__gemma-4-e4b-bf16 IMAGE=/path/to/image.jpg"
          exit 1
        fi
      - |
        if [ -n "{{.IMAGE}}" ] && [ -n "{{.AUDIO}}" ] && [ -n "{{.SYSTEM}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --image {{.IMAGE}} --audio {{.AUDIO}} --system '{{.SYSTEM}}' {{.CLI_ARGS}}
        elif [ -n "{{.IMAGE}}" ] && [ -n "{{.AUDIO}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --image {{.IMAGE}} --audio {{.AUDIO}} {{.CLI_ARGS}}
        elif [ -n "{{.IMAGE}}" ] && [ -n "{{.SYSTEM}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --image {{.IMAGE}} --system '{{.SYSTEM}}' {{.CLI_ARGS}}
        elif [ -n "{{.AUDIO}}" ] && [ -n "{{.SYSTEM}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --audio {{.AUDIO}} --system '{{.SYSTEM}}' {{.CLI_ARGS}}
        elif [ -n "{{.IMAGE}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --image {{.IMAGE}} {{.CLI_ARGS}}
        elif [ -n "{{.AUDIO}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --audio {{.AUDIO}} {{.CLI_ARGS}}
        elif [ -n "{{.SYSTEM}}" ]; then
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} --system '{{.SYSTEM}}' {{.CLI_ARGS}}
        else
          {{.PYTHON}} -m app.cli.main chat-media --model {{.MODEL}} {{.CLI_ARGS}}
        fi

  # ── Testing ──────────────────────────────────────────────────────────────

  test:
    desc: "Run the test suite"
    cmds:
      - "{{.PYTHON}} -m pytest tests/ -v"

  test:smoke:
    desc: "Run fast smoke and lifecycle tests"
    cmds:
      - "{{.PYTHON}} -m pytest tests/test_smoke.py tests/test_model_lifecycle.py -v"

  # ── Utility ──────────────────────────────────────────────────────────────

  clean:
    desc: "Remove Python cache files"
    cmds:
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -name "*.pyc" -delete 2>/dev/null || true
      - find . -name "*.pyo" -delete 2>/dev/null || true
